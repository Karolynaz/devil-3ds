---
name: Nintendo 3DS

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - '**'
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends --no-install-suggests \
            ffmpeg gettext python3
          dkp-pacman -S --needed --noconfirm 3ds-curl

      - name: Get external dependencies
        run: |
          wget https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j "bannertool.zip" "linux-x86_64/bannertool" -d "/opt/devkitpro/tools/bin"
          wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip "makerom-v0.18-ubuntu_x86_64.zip" "makerom" -d "/opt/devkitpro/tools/bin"
          chmod a+x /opt/devkitpro/tools/bin/makerom

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake

      - name: Check nested asset cleanup
        run: cmake -DTEST_DIRECTORY="$PWD/build/asset-trim-regression" -P tools/tests/test_asset_trimming.cmake

      - name: Build Devil-3Ds
        run: cmake --build build -- -k 100

      - name: Verify bundled package assets
        run: python3 tools/verify_3ds_packages.py build

      - name: Preserve debugging symbols
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devil-3ds-debug-symbols
          path: ./build/devil-3ds.elf.elf
          if-no-files-found: error

      - name: Upload 3dsx Package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devil-3ds.3dsx
          path: ./build/devil-3ds.3dsx

      - name: Upload cia Package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devil-3ds.cia
          path: ./build/devil-3ds.cia
